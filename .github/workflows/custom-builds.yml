name: Custom Builds

# Releases firmware from beala/main, this fork's own main line: each push builds the boards below and
# publishes a release if beala/main changed since the last one.
#
# Features: commit them to beala/main (or merge a short-lived branch into it) and push; the push
# starts a run. Upstream PRs: cut a branch from upstream/dev and cherry-pick the feature onto it.
# Upstream dev is merged by hand, not here: builds fail on any compiler warning, so new upstream code
# has to be fixed up first. To take it in (meshcore-dev/MeshCore is the remote "origin" in the
# usual checkout):
#   git fetch origin dev && git merge origin/dev   # fix conflicts and warnings, build TARGETS, push

permissions:
  contents: write

on:
  push:
    branches: [beala/main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Build and release even if nothing changed since the last release.'
        type: boolean
        default: false

concurrency:
  group: custom-builds
  cancel-in-progress: false

env:
  TARGETS: >-
    Heltec_t1_companion_radio_usb Heltec_t1_companion_radio_ble
    MeshTracker_X1_companion_radio_usb MeshTracker_X1_companion_radio_ble
    RAK_WisMesh_Tag_companion_radio_usb RAK_WisMesh_Tag_companion_radio_ble
    t1000e_companion_radio_usb t1000e_companion_radio_ble
    Heltec_v3_companion_radio_usb Heltec_v3_companion_radio_ble
    heltec_v4_companion_radio_usb heltec_v4_companion_radio_ble
    AB_Xiao_nrf52_LR2021_companion_radio_usb AB_Xiao_nrf52_LR2021_companion_radio_ble
    ab_labs_wisblock_nicerf_LoRa2021F33-2G4_companion_radio_usb ab_labs_wisblock_nicerf_LoRa2021F33-2G4_companion_radio_ble
    meshnology_w12_companion_radio_usb meshnology_w12_companion_radio_ble
    RAK_3401_repeater
  KEEP_RELEASES: 10  # older beala-* releases (and their tags) are deleted

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      sha: ${{ steps.rebuild.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
      short: ${{ steps.check.outputs.short }}
      targets: ${{ steps.describe.outputs.targets }}
      firmware_version: ${{ steps.describe.outputs.firmware_version }}
      date: ${{ steps.describe.outputs.date }}
      notes: ${{ steps.describe.outputs.notes }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          ref: beala/main
          fetch-depth: 0

      - name: Fetch upstream dev
        # only for the release notes, which say how much of upstream is in this build
        id: rebuild
        run: |
          git remote add upstream https://github.com/meshcore-dev/MeshCore.git
          git fetch --no-tags upstream dev
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.rebuild.outputs.sha }}
        run: |
          SHORT=${SHA:0:7}
          TAG="beala-${SHORT}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          if [ "${{ github.event.inputs.force }}" != "true" ] \
            && gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null; then
            echo "Release $TAG already exists; nothing to do."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Describe build
        if: steps.check.outputs.should_build == 'true'
        id: describe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "targets=$(echo $TARGETS | jq -Rc 'split(" ")')" >> $GITHUB_OUTPUT
          # Name builds after the latest upstream release they are newer than, e.g. v1.18.0-dev-beala
          LATEST=$(git ls-remote --tags --refs upstream 'companion-v*' | sed 's#.*/companion-##' | sort -V | tail -1)
          echo "firmware_version=${LATEST}-dev-beala" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          {
            echo 'notes<<EOF'
            echo "Firmware built from [beala/main](https://github.com/${GITHUB_REPOSITORY}/tree/beala/main) at $(git rev-parse --short HEAD), which includes upstream \`dev\` up to $(git rev-parse --short $(git merge-base upstream/dev HEAD)) ($(git rev-list --count HEAD..upstream/dev) newer upstream commits not merged)."
            PREV=$(gh release list --repo ${{ github.repository }} --limit 50 --json tagName,createdAt \
              -q '[.[] | select(.tagName | startswith("beala-"))] | sort_by(.createdAt) | reverse | .[0].tagName')
            if [ -n "$PREV" ] && git rev-parse -q --verify "$PREV^{commit}" >/dev/null \
               && git merge-base --is-ancestor "$PREV" HEAD; then
              echo
              echo "Changes since $PREV:"
              echo
              git log --first-parent --format='- %s' "$PREV..HEAD"
            fi
            echo
            echo "Full diff against upstream: https://github.com/${GITHUB_REPOSITORY}/compare/$(git rev-parse upstream/dev)...$(git rev-parse HEAD)"
            echo EOF
          } >> $GITHUB_OUTPUT

  # Host tests and fuzzers under AddressSanitizer + UBSan; a failure stops the release
  test:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Run tests
        run: pio test -e native_asan -e native_kiss_modem -e native_crypto -e native_entropy -e native_cli -e native_meshtastic -e native_wxsensor -e native_clone

      - name: Fuzz (a minute each, one per core at a time)
        run: test/fuzz/run.sh 60

      - name: Keep fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            .pio/fuzz/findings
            .pio/fuzz/*.log
          if-no-files-found: ignore

  # One job per firmware, all in parallel
  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.target }}
        env:
          FIRMWARE_VERSION: ${{ needs.prepare.outputs.firmware_version }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.target }}
          path: out

  release:
    needs: [prepare, test, build]
    runs-on: ubuntu-latest
    steps:

      - name: Download Firmwares
        uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.date }} (${{ needs.prepare.outputs.short }})
          body: ${{ needs.prepare.outputs.notes }}
          files: out/*

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("beala-"))] | sort_by(.createdAt) | reverse | .[]
                | .tagName' \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r tag; do
                echo "Deleting $tag"
                gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
              done

      - name: Update the flasher
        # Starts the fluxcore.party deploy (beala/fluxcore-site) now, instead of waiting for its
        # 15-minute schedule (GitHub runs schedules best-effort and often skips them for hours).
        # Needs a FLUXCORE_SITE_TOKEN secret: a fine-grained token for beala/fluxcore-site with
        # "Actions: Read and write". Without it this step just says so and does nothing.
        env:
          GH_TOKEN: ${{ secrets.FLUXCORE_SITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No FLUXCORE_SITE_TOKEN secret: the flasher will pick this release up on its schedule"
            exit 0
          fi
          gh workflow run flasher.yml --repo beala/fluxcore-site --ref main
