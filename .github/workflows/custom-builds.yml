name: Custom Builds

# Rebuilds beala/integration (upstream dev + the branches in scripts/integration-branches.txt),
# then builds firmware for the boards below and publishes a release whenever it changed.

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */8 * * *'  # Check every 8 hours
  workflow_dispatch:
    inputs:
      force:
        description: 'Build and release even if nothing changed since the last release.'
        type: boolean
        default: false

env:
  TARGETS: >-
    Heltec_t1_companion_radio_usb Heltec_t1_companion_radio_ble
    MeshTracker_X1_companion_radio_usb MeshTracker_X1_companion_radio_ble
    RAK_WisMesh_Tag_companion_radio_usb RAK_WisMesh_Tag_companion_radio_ble
    t1000e_companion_radio_usb t1000e_companion_radio_ble
    Heltec_v3_companion_radio_usb Heltec_v3_companion_radio_ble
    heltec_v4_companion_radio_usb heltec_v4_companion_radio_ble
    RAK_3401_repeater

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that change workflow files. If upstream changes one
          # and the push is refused, add a personal access token as the INTEGRATION_PUSH_TOKEN secret.
          token: ${{ secrets.INTEGRATION_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebuild integration branch
        id: rebuild
        run: scripts/rebuild-integration.sh --push

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.rebuild.outputs.sha }}
        run: |
          SHORT=${SHA:0:7}
          TAG="beala-${SHORT}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          if [ "${{ github.event.inputs.force }}" != "true" ] \
            && gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null; then
            echo "Release $TAG already exists; nothing to do."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Describe build
        if: steps.check.outputs.should_build == 'true'
        id: describe
        run: |
          # Name builds after the latest upstream release they are newer than, e.g. v1.18.0-dev-beala
          LATEST=$(git ls-remote --tags --refs upstream 'companion-v*' | sed 's#.*/companion-##' | sort -V | tail -1)
          echo "firmware_version=${LATEST}-dev-beala" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          {
            echo 'notes<<EOF'
            echo "Firmware built from upstream \`dev\` ($(git rev-parse --short upstream/dev)) plus these branches:"
            echo
            git log --first-parent --merges --reverse --format='%s' upstream/dev..HEAD \
              | sed -n "s/^Merge branch '\(.*\)' into .*/\1/p" \
              | while read -r b; do echo "- [$b](https://github.com/${GITHUB_REPOSITORY}/tree/$b)"; done
            echo
            echo "Full diff against upstream: https://github.com/${GITHUB_REPOSITORY}/compare/$(git rev-parse upstream/dev)...${{ steps.rebuild.outputs.sha }}"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Setup Build Environment
        if: steps.check.outputs.should_build == 'true'
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        if: steps.check.outputs.should_build == 'true'
        env:
          FIRMWARE_VERSION: ${{ steps.describe.outputs.firmware_version }}
        run: /usr/bin/env bash build.sh build-firmware $TARGETS

      - name: Upload Workflow Artifacts
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmwares-${{ steps.check.outputs.tag }}
          path: out

      - name: Create Release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ steps.rebuild.outputs.sha }}
          name: ${{ steps.describe.outputs.date }} (${{ steps.check.outputs.short }})
          body: ${{ steps.describe.outputs.notes }}
          files: out/*
