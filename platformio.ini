; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
  variants/*/platformio.ini
  platformio.local.ini

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
  SPI
  Wire
  jgromes/RadioLib @ 7.8.1
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
; beala: MeshCore's own code (not libraries) builds with -Wall, and any warning fails the build: a
; string copied into a buffer too small for it froze radios while upstream's -w hid the warning.
; #warning notices from library headers (e.g. RadioLib's god mode) still print but don't fail it.
build_src_flags = -Wall -Werror -Wno-error=cpp
build_flags = -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1   ; NOTE: comment these out for more secure firmware
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
build_src_filter =
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/radiolib/*.cpp>
  +<helpers/meshtastic/*.cpp>
  +<helpers/weather/*.cpp>
  +<helpers/aircraft/*.cpp>
  +<helpers/bridges/BridgeBase.cpp>
  +<helpers/ui/MomentaryButton.cpp>

; ----------------- ESP32 ---------------------

[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts = merge-bin.py
build_flags = ${arduino_base.build_flags}
  -fstack-protector-strong   ; beala: a stack buffer overrun panics and reboots (ESP-IDF's handler)
  -D ESP32_PLATFORM
;  -D ESP32_CPU_FREQ=80          ; change it to your need
build_src_filter = ${arduino_base.build_src_filter}

[esp32_ota]
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  file://arch/esp32/AsyncElegantOTA

; esp32c6 uses arduino framework 3.x
; WARNING: experimental. May not work as stable as other platforms.
[esp32c6_base]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip

; ----------------- NRF52 ---------------------

[nrf52_base]
extends = arduino_base
platform = nordicnrf52
platform_packages =
  ; use internal fork that includes patch to ble stack to prevent firmware lockup during rapid connect/disconnect
  ; https://github.com/meshcore-dev/MeshCore/pull/1177
  ; https://github.com/meshcore-dev/MeshCore/pull/1295
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301665b40959682252911e57b11df3ee651a
  platformio/toolchain-gccarmnoneeabi@^1.140201.0
extra_scripts = create-uf2.py
build_flags = ${arduino_base.build_flags}
  -fstack-protector-strong   ; beala: a stack buffer overrun reboots and is reported, see NRF52Board.cpp
  -D NRF52_PLATFORM
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
  -D USE_CC310_HW_CRYPTO=1
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/oltaco/CustomLFS#0.2.3
; ----------------- RP2040 ---------------------

[rp2040_base]
extends = arduino_base
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git   ; framework-arduinopico @ 1.50600.0+sha.6a1d13e9
build_flags = ${arduino_base.build_flags}
  -D RP2040_PLATFORM

; ----------------- STM32 ----------------------

[stm32_base]
extends = arduino_base
; Pinned pending upstream fix for upstream conversions.
; https://github.com/jgromes/RadioLib/issues/1873
platform = ststm32@19.7.1
extra_scripts = post:arch/stm32/build_hex.py
build_flags = ${arduino_base.build_flags}
  -D STM32_PLATFORM
  -I src/helpers/stm32
  -I $PROJECT_PACKAGES_DIR/framework-arduinoststm32/libraries/SubGhz/src
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/stm32>
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
  SubGhz

[sensor_base]
build_flags =
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  robtillaart/INA226 @ ^0.6.4
  adafruit/Adafruit INA260 Library @ ^1.5.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit SHTC3 Library @ ^1.0.1
  sensirion/Sensirion I2C SHT4x @ ^1.1.2
  arduino-libraries/Arduino_LPS22HB @ ^1.0.2
  adafruit/Adafruit MLX90614 Library @ ^2.1.5
  adafruit/Adafruit_VL53L0X @ ^1.2.4
  stevemarple/MicroNMEA @ ^2.0.6
  adafruit/Adafruit BME680 Library @ ^2.0.4
  adafruit/Adafruit BMP085 Library @ ^1.2.4

; ----------------- TESTING ---------------------

[env:native]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I test/mocks
test_build_src = yes
test_ignore =
  test_kiss_modem
  test_crypto_v2*
  test_entropy
  test_common_cli
  test_meshtastic
  test_wxsensor
  test_uat
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/AesSiv.cpp>
  +<../src/CryptoV2.cpp>
  +<../src/Packet.cpp>
  +<../src/helpers/AdvertDataHelpers.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/DynamicConfigSerializer.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_asan]
extends = env:native
build_unflags = -Os
build_flags = ${env:native.build_flags}
  -O1
  -g
  -fsanitize=address,undefined
  -fno-sanitize-recover=all   ; undefined behavior fails the test instead of just printing
  -fno-sanitize=shift-base    ; ed25519 left-shifts negative numbers on purpose
  -fno-omit-frame-pointer

[env:native_crypto]
; AES-SIV / v2 envelope tests against the real rweather Crypto code. The library is
; installed but not built as a whole (its RNG needs Arduino), only the files used here.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I .pio/libdeps/native_crypto/Crypto
  -I test/mocks
  -I lib/ed25519
  -O1 -g -fsanitize=address,undefined -fno-sanitize=shift -fno-omit-frame-pointer -fno-sanitize-recover=all
test_build_src = yes
test_filter = test_crypto_v2*
lib_ldf_mode = off
build_unflags = -Os
extra_scripts = post:test/asan_link.py
build_src_filter =
  -<*>
  +<../src/AesSiv.cpp>
  +<../src/CryptoV2.cpp>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../lib/ed25519/*.c>
  +<../.pio/libdeps/native_crypto/Crypto/AES128.cpp>
  +<../.pio/libdeps/native_crypto/Crypto/AESCommon.cpp>
  +<../.pio/libdeps/native_crypto/Crypto/BlockCipher.cpp>
  +<../.pio/libdeps/native_crypto/Crypto/Crypto.cpp>
  +<../.pio/libdeps/native_crypto/Crypto/Hash.cpp>
  +<../.pio/libdeps/native_crypto/Crypto/SHA256.cpp>
lib_deps =
  google/googletest @ 1.17.0
  rweather/Crypto @ ^0.4.0

[env:native_meshtastic]
; Meshtastic decoding (src/helpers/meshtastic) against packets made by lr2021-re-public's
; tools/meshtastic_node.py, under AddressSanitizer + UBSan, with the real rweather AES.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I .pio/libdeps/native_meshtastic/Crypto
  -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
test_build_src = yes
test_filter = test_meshtastic
lib_ldf_mode = off
build_unflags = -Os
extra_scripts = post:test/asan_link.py
build_src_filter =
  -<*>
  +<../src/helpers/meshtastic/MeshtasticRx.cpp>
  +<../.pio/libdeps/native_meshtastic/Crypto/AES128.cpp>
  +<../.pio/libdeps/native_meshtastic/Crypto/AES256.cpp>
  +<../.pio/libdeps/native_meshtastic/Crypto/AESCommon.cpp>
  +<../.pio/libdeps/native_meshtastic/Crypto/BlockCipher.cpp>
  +<../.pio/libdeps/native_meshtastic/Crypto/Crypto.cpp>
lib_deps =
  google/googletest @ 1.17.0
  rweather/Crypto @ ^0.4.0

[env:native_wxsensor]
; Weather sensor decoding and listen scheduling (src/helpers/weather), and UAT and 1090 MHz ADS-B
; aircraft messages (src/helpers/aircraft), under AddressSanitizer + UBSan.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
test_build_src = yes
test_filter =
  test_wxsensor
  test_uat
  test_adsb
lib_ldf_mode = off
build_unflags = -Os
extra_scripts = post:test/asan_link.py
build_src_filter =
  -<*>
  +<../src/helpers/weather/*.cpp>
  +<../src/helpers/aircraft/*.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_cli]
; Every repeater/room CLI command (CommonCLI, regions, ACL, radio prefs) under AddressSanitizer + UBSan,
; replies into buffers of the firmware's size. test/cli_mocks stands in for Arduino, the filesystem, RTClib.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/cli_mocks
  -I src
  -I .pio/libdeps/native_cli/Crypto
  -I test/mocks
  -I lib/ed25519
  -O1 -g -fsanitize=address,undefined -fno-sanitize=shift-base -fno-sanitize-recover=all -fno-omit-frame-pointer
build_unflags = -Os
extra_scripts = post:test/asan_link.py
test_build_src = yes
test_filter = test_common_cli
lib_ldf_mode = off
build_src_filter =
  -<*>
  +<../src/helpers/CommonCLI.cpp>
  +<../src/helpers/CommonRadioPrefs.cpp>
  +<../src/helpers/RegionMap.cpp>
  +<../src/helpers/ClientACL.cpp>
  +<../src/helpers/TransportKeyStore.cpp>
  +<../src/helpers/TxtDataHelpers.cpp>
  +<../src/helpers/AdvertDataHelpers.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/DynamicConfigSerializer.cpp>
  +<../src/Identity.cpp>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../lib/ed25519/*.c>
  +<../.pio/libdeps/native_cli/Crypto/AES128.cpp>
  +<../.pio/libdeps/native_cli/Crypto/AESCommon.cpp>
  +<../.pio/libdeps/native_cli/Crypto/BlockCipher.cpp>
  +<../.pio/libdeps/native_cli/Crypto/Crypto.cpp>
  +<../.pio/libdeps/native_cli/Crypto/Hash.cpp>
  +<../.pio/libdeps/native_cli/Crypto/SHA256.cpp>
  +<../.pio/libdeps/native_cli/Crypto/SHA512.cpp>
  +<../.pio/libdeps/native_cli/Crypto/Ed25519.cpp>
  +<../.pio/libdeps/native_cli/Crypto/Curve25519.cpp>
  +<../.pio/libdeps/native_cli/Crypto/BigNumberUtil.cpp>
lib_deps =
  google/googletest @ 1.17.0
  rweather/Crypto @ ^0.4.0
  densaugeo/base64 @ ~1.4.0   ; for test/fuzz/build.sh

[env:native_entropy]
; EntropyPool / HMAC-DRBG tests with the real rweather SHA-256 (only the files used here are built)
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I .pio/libdeps/native_entropy/Crypto
  -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
build_unflags = -Os
extra_scripts = post:test/asan_link_entropy.py
test_build_src = yes
test_filter = test_entropy
lib_ldf_mode = off
build_src_filter =
  -<*>
  +<../src/helpers/EntropyPool.cpp>
  +<../.pio/libdeps/native_entropy/Crypto/Crypto.cpp>
  +<../.pio/libdeps/native_entropy/Crypto/Hash.cpp>
  +<../.pio/libdeps/native_entropy/Crypto/SHA256.cpp>
lib_deps =
  google/googletest @ 1.17.0
  rweather/Crypto @ ^0.4.0

[env:native_kiss_modem]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/mocks
  -I src
  -I examples/kiss_modem
  -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
build_unflags = -Os
extra_scripts = post:test/asan_link.py
test_build_src = yes
test_filter = test_kiss_modem
build_src_filter =
  -<*>
  +<../examples/kiss_modem/KissModem.cpp>
lib_deps =
  google/googletest @ 1.17.0
