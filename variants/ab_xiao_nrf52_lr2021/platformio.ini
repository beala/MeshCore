[AB_Xiao_nrf52_LR2021]
extends = nrf52_base
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/ab_xiao_nrf52_lr2021
  -UENV_INCLUDE_GPS
  -D NRF52_PLATFORM
  -D AB_XIAO_NRF52_LR2021
  -D USE_LR2021
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_BUSY=D1
  -D P_LORA_NSS=D2
  -D P_LORA_SCLK=D3
  -D P_LORA_MOSI=D4
  -D P_LORA_MISO=D5
  -D P_LORA_RESET=D6
  ; D7 -> LR2021 DIO7 and D9 -> LR2021 DIO11 are wired but currently unused/reserved
  -D P_LORA_DIO_1=D8       ; IRQ line, wired to LR2021 DIO8
  -D LR2021_IRQ_DIO=8      ; tells RadioLib the LR2021 is configured to output its IRQ on DIO8
  -D LR2021_TCXO_VOLTAGE=1.6f
  -D LR2021_USE_SIMO       ; run the radio on its SIMO DC-DC instead of the default LDOs
  ; Sub-GHz PA over-current threshold, 0..63 (chip default 41, ~164 mA). At 22 dBm this
  ; board needs 42 into a 50 ohm load; 52 adds Semtech's recommended 25% margin.
  -D LR2021_OCP_LF=52
  ; D1-D9 are all consumed by the LR2021 wiring, leaving only D0 and D10
  ; broken out on the header; no user button is wired on this board, so
  ; those two are used for I2C instead (needed by the nRF52 Arduino core
  ; even if nothing is connected to it).
  -D PIN_WIRE_SDA=D0
  -D PIN_WIRE_SCL=D10
  ; 0.96" 128x64 SSD1306 OLED on the same I2C bus (SDA=D0, SCL=D10); the
  ; module only breaks out VCC/GND/SDA/SCL, so there's no reset pin wired.
  -D PIN_OLED_RESET=-1
  ; No user button is wired, so there's no way to wake the display back up
  ; once it auto-off's. Disable the timeout entirely; keep it on always.
  -D AUTO_OFF_MILLIS=0
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/ab_xiao_nrf52_lr2021>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps = ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}

[env:AB_Xiao_nrf52_LR2021_companion_radio_ble]
extends = AB_Xiao_nrf52_LR2021
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${AB_Xiao_nrf52_LR2021.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
;  -D BLE_DEBUG_LOGGING=1
  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
  -D QSPIFLASH=1
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${AB_Xiao_nrf52_LR2021.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${AB_Xiao_nrf52_LR2021.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13

