; AB Labs WisBlock IO-slot carrier with a NiceRF LoRa2021F33-2G4 (LR2021, 1W @ 868/915, 2W @ 433/470)
; on a RAK3401 core + RAK19007 base board. Sub-GHz only.
; NOTE: needs a battery connected. On USB power alone the RAK19007 charger can't supply the PA
; (the LR2021 browns out mid-TX at drive >= ~7 dBm and stops responding).
[ab_labs_wisblock_nicerf_LoRa2021F33-2G4]
extends = nrf52_base
board = rak3401
board_check = true
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  ; no WisBlock GPS: the carrier uses IO1/IO2/IO4/IO5/IO6 (see variant.h)
  -UENV_INCLUDE_GPS
  -I variants/ab_labs_wisblock_nicerf_LoRa2021F33-2G4
  -D AB_LABS_WISBLOCK_NICERF_LR2021F33_2G4
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D USE_LR2021
  -D LR2021_IRQ_DIO=9            ; module IRQ pin (-> P0.10 / WB_IO6) is LR2021 DIO9
  ; module has a TCXO (fails to start at 0 V). NiceRF's demo uses 3.3 V, but the LR2021 runs from
  ; the module's 3.3 V LDO so 3.3 V has no headroom; 1.6/1.8/3.0 V all start cleanly.
  -D LR2021_TCXO_VOLTAGE=1.8f
  ; TX power is the LR2021 drive level in dBm (-9..22) into the module's external PA.
  ; NiceRF power table @868/915 MHz (their "register value" = SetTxParams TxPower = 2 * drive):
  ;   drive 22 (reg 44) -> 29.8 dBm, 724 mA    drive 16 (reg ~31) -> ~28.3 dBm, 540 mA
  ;   drive 19 (reg ~37) -> ~29.3 dBm, ~640 mA  drive 13 (reg ~25) -> ~26.5 dBm, 432 mA
  ;   drive  7 (reg ~13) -> ~21.4 dBm, 265 mA   drive  1 (reg ~1)  -> ~16.2 dBm, 197 mA
  ; (433/470 MHz modules: drive 18 (reg 36) already gives ~33 dBm / 2 W.)
  ; Above ~19 the PA is compressed: +0.5 dB costs ~90 mA, so default to 19.
  ; target.cpp uses NiceRF's PA config (duty 7 / 6 slices, TxPower = 2*dBm) so this table applies.
  -D LORA_TX_POWER=19
  -D MAX_LORA_TX_POWER=22
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/ab_labs_wisblock_nicerf_LoRa2021F33-2G4>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

